
name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r ".github/workflows/BaseballMaster_GitHub_Package/requirements.txt"

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name BASEBALL_MASTER --paths ".github/workflows/BaseballMaster_GitHub_Package" ".github/workflows/BaseballMaster_GitHub_Package/baseball_master.py"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BASEBALL_MASTER-Windows
          path: dist/BASEBALL_MASTER.exe
          if-no-files-found: error
