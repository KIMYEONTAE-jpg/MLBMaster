name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BASEBALL_MASTER baseball_master.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: BASEBALL_MASTER-Windows
          path: dist/BASEBALL_MASTER.exe
      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BASEBALL_MASTER.exe
